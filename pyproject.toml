[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voicematch"
version = "0.1.0"
description = "Offline voice-to-singer similarity engine"
requires-python = ">=3.11"
# Exact pins, not floors: the pipeline stores vectors and versions (G4), so the
# numerical stack that produced them is part of what a stored library means.
# These are the versions this branch was verified with (finding I5).
dependencies = [
    "numpy==2.2.6",
    "scipy==1.18.1",
    "librosa==1.0.0",
    "soundfile==0.14.0",
    "pyloudnorm==0.2.0",
    "praat-parselmouth==0.4.7",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
# The production backbone and the audio frontend are pinned together: a
# different pair re-means every stored embedding.  These are the official
# lockstep 2.11 releases (matching version numbers): 2.11.0 is the highest
# version at which both torch and torchaudio publish an exact-match wheel.
# The earlier 2.15.0/2.11.1 pair was mismatched and is no longer verified.
# demucs is left unpinned: it was never installed or verified on this branch.
ml = ["torch==2.11.0", "torchaudio==2.11.0", "demucs"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
