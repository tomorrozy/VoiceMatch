<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoiceMatch 盲听标注</title>
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --border: #d8d8d2; --text: #24241f;
    --muted: #6b6b62; --accent: #185fa5; --accent-soft: #e6f1fb;
    --ok: #3b6d11; --warn: #993c1d; --chip: #eef0ec;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; font-size: 14px; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 20px 60px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 16px; font-weight: 600; margin: 24px 0 10px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  .card { background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=text] { width: 100%; padding: 9px 11px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; background: #fff; color: var(--text); }
  input[type=file] { font-size: 13px; }
  .btn { display: inline-block; border: 1px solid var(--accent); background: var(--accent);
    color: #fff; padding: 9px 18px; border-radius: 8px; cursor: pointer; font-size: 14px;
    font-weight: 600; }
  .btn.secondary { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .btn.ghost { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .status { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 12px; }
  .status.ok { background: #eaf3de; color: var(--ok); }
  .status.warn { background: #faece7; color: var(--warn); }
  .status.info { background: var(--accent-soft); color: var(--accent); }
  .hidden { display: none; }
  .progress { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .query-block { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .qid { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 13px; }
  audio { width: 100%; max-width: 420px; height: 38px; }
  .cand-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 14px; }
  .cand { display: flex; align-items: center; gap: 12px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 10px; cursor: pointer; }
  .cand:hover { border-color: var(--accent); }
  .cand.selected { background: var(--accent-soft); border-color: var(--accent); }
  .cand .name { font-weight: 600; min-width: 120px; }
  .cand .sid { color: var(--muted); font-family: ui-monospace, Consolas, monospace;
    font-size: 12px; min-width: 90px; }
  .cand audio { max-width: 300px; }
  .cand .check { margin-left: auto; font-weight: 600; color: var(--accent); }
  .none-row { margin-top: 14px; padding: 12px; border: 1px dashed var(--border);
    border-radius: 10px; text-align: center; cursor: pointer; }
  .none-row.selected { background: #faece7; border-color: var(--warn); color: var(--warn); }
  .counter { font-size: 13px; color: var(--muted); }
  .modes { display: flex; gap: 10px; flex-wrap: wrap; }
  .mode-opt { flex: 1; min-width: 220px; border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; cursor: pointer; }
  .mode-opt.active { border-color: var(--accent); background: var(--accent-soft); }
  .mode-opt .t { font-weight: 600; }
  .mode-opt .d { font-size: 12px; color: var(--muted); }
  .pair-side { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 12px; }
  .pair-side .h { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .pair-side .tag { display: inline-block; width: 26px; height: 26px; line-height: 26px;
    text-align: center; border-radius: 50%; background: var(--chip); font-weight: 600; }
  .pair-pick { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
  .pair-pick .btn.picked { background: var(--accent); color: #fff; }
  code { background: var(--chip); padding: 2px 6px; border-radius: 5px; font-size: 12px; }
  .tip { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>VoiceMatch 盲听标注</h1>
  <p class="sub">只用耳朵判断，不要猜哪个是系统推荐。候选顺序已打乱，没有标准答案。</p>

  <div class="card">
    <label>标注模式</label>
    <div class="modes">
      <div class="mode-opt active" id="modeMulti" onclick="setMode('multi')">
        <div class="t">多选标注</div>
        <div class="d">从 8 位里选最像的 1–2 位（sheet.json）</div>
      </div>
      <div class="mode-opt" id="modePair" onclick="setMode('pair')">
        <div class="t">pairwise 比较</div>
        <div class="d">A 和 B 哪个更像（pairs.json，kappa 未达标时的重标）</div>
      </div>
    </div>
  </div>

  <div class="card">
    <label for="dirInput">1. 选择基准集目录</label>
    <input type="file" id="dirInput" webkitdirectory directory multiple>
    <p class="tip" id="dirHint">目录需含 sheet.json、samples/samples.json 与查询录音。</p>
    <div id="loadStatus" class="status hidden"></div>
  </div>

  <div id="main" class="hidden">
    <div class="card">
      <label for="annotatorId">2. 标注者 ID</label>
      <input type="text" id="annotatorId" placeholder="例如 rater1" autocomplete="off">
      <p class="tip">不同标注者使用不同 ID；独立标注，不要互相讨论。</p>
    </div>

    <div class="card">
      <div class="query-block">
        <span class="progress" id="progress">第 0 / 0 条</span>
        <span class="qid" id="qid"></span>
      </div>
      <div style="margin-top:10px"><audio id="queryAudio" controls></audio></div>

      <!-- multi-select panel -->
      <div id="multiPanel">
        <h2 style="margin-bottom:6px">从候选里选最像的 1–2 位</h2>
        <div class="cand-grid" id="candGrid"></div>
        <div class="none-row" id="noneRow">都不像（库里没有接近的声音）</div>
        <div class="counter" id="counter" style="margin-top:10px"></div>
      </div>

      <!-- pairwise panel -->
      <div id="pairPanel" class="hidden">
        <h2 style="margin-bottom:6px">这对里，哪个更像查询？</h2>
        <div class="pair-side">
          <div class="h"><span class="tag">A</span><span class="name" id="pairAName"></span></div>
          <audio id="pairAudioA" controls></audio>
        </div>
        <div class="pair-side">
          <div class="h"><span class="tag">B</span><span class="name" id="pairBName"></span></div>
          <audio id="pairAudioB" controls></audio>
        </div>
        <div class="pair-pick">
          <button class="btn" id="pickA">选 A 更像</button>
          <button class="btn secondary" id="pickB">选 B 更像</button>
          <button class="btn ghost" id="pickNone">分不出 / 都不像</button>
        </div>
        <div class="counter" id="pairCounter" style="margin-top:10px"></div>
      </div>

      <div class="btn-row">
        <button class="btn secondary" id="prevBtn">← 上一条</button>
        <button class="btn" id="nextBtn">下一条 →</button>
        <button class="btn secondary" id="clearBtn">清空本题</button>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">3. 导出标注</h2>
      <div id="summary" class="tip"></div>
      <div class="btn-row">
        <button class="btn" id="exportBtn" disabled>导出标注 JSON</button>
        <button class="btn secondary" id="saveProgressBtn">保存进度到本机</button>
        <button class="btn secondary" id="loadProgressBtn">载入本机进度</button>
      </div>
      <p class="tip" style="margin-top:10px" id="exportHint"></p>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  const state = {
    mode: "multi",
    files: new Map(),
    sheet: [],          // multi: sheet.json list
    pairs: [],          // pair: pairs.json 'tasks'
    queryPaths: new Map(), // query_id -> path (from sheet, used in pair mode)
    sampleMap: new Map(),
    answers: {},        // multi: query_id -> picked[] | pair: pair_id -> 'a'|'b'|null
    index: 0,
    annotator: ""
  };
  const $ = (id) => document.getElementById(id);
  const MAX_PICKS = 2;

  function norm(p) { return String(p).replace(/\\/g, "/").replace(/^\.\//, "").toLowerCase(); }
  function basename(p) { return norm(p).split("/").pop(); }
  function setStatus(msg, kind) {
    const el = $("loadStatus");
    el.className = "status " + (kind || "info");
    el.textContent = msg;
    el.classList.remove("hidden");
  }
  function lsKey() { return "voicematch-annotation-" + state.mode; }

  window.setMode = function (mode) {
    state.mode = mode;
    $("modeMulti").classList.toggle("active", mode === "multi");
    $("modePair").classList.toggle("active", mode === "pair");
    $("multiPanel").classList.toggle("hidden", mode !== "multi");
    $("pairPanel").classList.toggle("hidden", mode !== "pair");
    $("dirHint").textContent = mode === "multi"
      ? "目录需含 sheet.json、samples/samples.json 与查询录音。"
      : "目录需含 pairs.json、sheet.json（查 query 路径）、samples/samples.json 与查询录音。";
    $("exportHint").textContent = mode === "multi"
      ? "导出 annotations-<id>.json，字段与 benchmark.py adjudicate 的输入一致。"
      : "导出 pair-annotations-<id>.json，字段与 benchmark.py pairwise-adjudicate 的输入一致。";
    resetData();
    setStatus("已切换到" + (mode === "multi" ? "多选标注" : "pairwise 比较") + "，请重新选择目录。", "info");
  };

  function resetData() {
    state.files.clear(); state.sheet = []; state.pairs = [];
    state.queryPaths.clear(); state.sampleMap.clear(); state.answers = {};
    state.index = 0; $("main").classList.add("hidden");
  }

  function findJson(name) {
    const target = basename(name);
    for (const [path, file] of state.files) {
      if (path.endsWith("/" + target) || path === target) return file;
    }
    return null;
  }
  function resolveFile(rawPath) {
    if (!rawPath) return null;
    const target = norm(rawPath);
    if (state.files.has(target)) return state.files.get(target);
    const base = basename(rawPath);
    for (const [path, file] of state.files) {
      if (path.endsWith("/" + base) || path === base) return file;
    }
    return null;
  }
  function objectUrl(file) { return URL.createObjectURL(file); }

  $("dirInput").addEventListener("change", async (e) => {
    const files = Array.from(e.target.files || []);
    state.files.clear();
    for (const file of files) {
      state.files.set(norm(file.webkitRelativePath || file.name), file);
    }
    try {
      const samplesFile = findJson("samples.json");
      if (!samplesFile) throw new Error("目录里找不到 samples/samples.json");
      const samples = JSON.parse(await samplesFile.text());
      state.sampleMap.clear();
      for (const s of samples) state.sampleMap.set(s.singer_id, s);

      const sheetFile = findJson("sheet.json");
      if (!sheetFile) throw new Error("目录里找不到 sheet.json");
      state.sheet = JSON.parse(await sheetFile.text());

      if (state.mode === "multi") {
        if (!Array.isArray(state.sheet) || !state.sheet.length)
          throw new Error("sheet.json 不是非空列表");
        for (const rec of state.sheet) {
          if (!(rec.query_id in state.answers)) state.answers[rec.query_id] = [];
        }
        setStatus("已载入 " + state.sheet.length + " 条 query，" + state.sampleMap.size + " 位歌手样本。", "ok");
      } else {
        const pairsFile = findJson("pairs.json");
        if (!pairsFile) throw new Error("pairwise 模式需要 pairs.json");
        const payload = JSON.parse(await pairsFile.text());
        state.pairs = payload.tasks || [];
        if (!state.pairs.length) throw new Error("pairs.json 的 tasks 为空");
        for (const rec of state.sheet) state.queryPaths.set(rec.query_id, rec.path);
        for (const t of state.pairs) if (!(t.pair_id in state.answers)) state.answers[t.pair_id] = null;
        setStatus("已载入 " + state.pairs.length + " 个比较对，" + state.sampleMap.size + " 位歌手样本。", "ok");
      }
      state.index = 0;
      $("main").classList.remove("hidden");
      render();
    } catch (err) {
      setStatus("载入失败：" + err.message, "warn");
    }
  });

  function setAudio(el, file) {
    if (file) { el.src = objectUrl(file); el.classList.remove("hidden"); }
    else { el.removeAttribute("src"); }
  }
  function sampleFile(sid) {
    const info = state.sampleMap.get(sid);
    if (!info || !info.file) return null;
    return state.files.get(norm("samples/" + info.file)) || resolveFile(info.file);
  }

  function currentLen() { return state.mode === "multi" ? state.sheet.length : state.pairs.length; }
  function currentId() {
    return state.mode === "multi" ? state.sheet[state.index].query_id : state.pairs[state.index].pair_id;
  }

  function render() {
    if (!currentLen()) return;
    $("progress").textContent = "第 " + (state.index + 1) + " / " + currentLen() + " 条";
    if (state.mode === "multi") renderMulti(); else renderPair();
    updateSummary();
  }

  function renderMulti() {
    const rec = state.sheet[state.index];
    $("qid").textContent = rec.query_id;
    setAudio($("queryAudio"), resolveFile(rec.path));
    const picked = state.answers[rec.query_id] || [];
    const grid = $("candGrid");
    grid.innerHTML = "";
    for (const sid of rec.candidates) {
      const info = state.sampleMap.get(sid) || { name: sid };
      const row = document.createElement("div");
      row.className = "cand" + (picked.includes(sid) ? " selected" : "");
      const name = document.createElement("span");
      name.className = "name"; name.textContent = info.name;
      const idspan = document.createElement("span");
      idspan.className = "sid"; idspan.textContent = sid;
      row.appendChild(name); row.appendChild(idspan);
      const au = document.createElement("audio");
      au.controls = true;
      const sf = sampleFile(sid);
      if (sf) au.src = objectUrl(sf); else { au.disabled = true; }
      row.appendChild(au);
      const chk = document.createElement("span");
      chk.className = "check"; chk.textContent = picked.includes(sid) ? "✓" : "";
      row.appendChild(chk);
      row.addEventListener("click", (ev) => {
        if (ev.target.tagName === "AUDIO") return;
        togglePick(rec.query_id, sid);
      });
      grid.appendChild(row);
    }
    $("noneRow").className = "none-row" + (picked.length === 0 ? " selected" : "");
    $("noneRow").onclick = () => { state.answers[rec.query_id] = []; render(); };
    $("counter").textContent = "本题已选 " + picked.length + " / " + MAX_PICKS + " 位" +
      (picked.length === 0 ? "（= 都不像）" : "");
  }

  function togglePick(qid, sid) {
    const arr = state.answers[qid] || [];
    const pos = arr.indexOf(sid);
    if (pos >= 0) arr.splice(pos, 1);
    else {
      if (arr.length >= MAX_PICKS) { $("counter").textContent = "最多选 " + MAX_PICKS + " 位；请先取消一位。"; return; }
      arr.push(sid);
    }
    state.answers[qid] = arr;
    render();
  }

  function renderPair() {
    const task = state.pairs[state.index];
    $("qid").textContent = task.query_id + " · " + task.pair_id;
    setAudio($("queryAudio"), resolveFile(state.queryPaths.get(task.query_id)));
    const aInfo = state.sampleMap.get(task.singer_a) || { name: task.singer_a };
    const bInfo = state.sampleMap.get(task.singer_b) || { name: task.singer_b };
    $("pairAName").textContent = aInfo.name + "（" + task.singer_a + "）";
    $("pairBName").textContent = bInfo.name + "（" + task.singer_b + "）";
    setAudio($("pairAudioA"), sampleFile(task.singer_a));
    setAudio($("pairAudioB"), sampleFile(task.singer_b));
    const choice = state.answers[task.pair_id];
    $("pickA").classList.toggle("picked", choice === "a");
    $("pickB").classList.toggle("picked", choice === "b");
    $("pickNone").classList.toggle("picked", choice === null || choice === undefined);
    $("pairCounter").textContent = "本题：" +
      (choice === "a" ? "选 A" : choice === "b" ? "选 B" : "未选 / 分不出");
  }

  function setPairChoice(value) {
    state.answers[state.pairs[state.index].pair_id] = value;
    render();
  }
  $("pickA").onclick = () => setPairChoice("a");
  $("pickB").onclick = () => setPairChoice("b");
  $("pickNone").onclick = () => setPairChoice(null);

  $("prevBtn").onclick = () => { if (state.index > 0) { state.index--; render(); } };
  $("nextBtn").onclick = () => { if (state.index < currentLen() - 1) { state.index++; render(); } };
  $("clearBtn").onclick = () => {
    const id = currentId();
    state.answers[id] = state.mode === "multi" ? [] : null;
    render();
  };
  $("annotatorId").addEventListener("input", (e) => { state.annotator = e.target.value.trim(); updateSummary(); });

  function updateSummary() {
    let answered = 0, none = 0;
    if (state.mode === "multi") {
      answered = state.sheet.filter(r => (state.answers[r.query_id] || []).length >= 1).length;
      none = state.sheet.filter(r => (state.answers[r.query_id] || []).length === 0).length;
    } else {
      answered = state.pairs.filter(t => state.answers[t.pair_id] === "a" || state.answers[t.pair_id] === "b").length;
      none = state.pairs.filter(t => state.answers[t.pair_id] === null || state.answers[t.pair_id] === undefined).length;
    }
    $("summary").textContent = "标注者：" + (state.annotator || "未填写") +
      " · 已判断 " + answered + " · 分不出/都不像 " + none + " · 共 " + currentLen() + " 条";
    $("exportBtn").disabled = !state.annotator;
  }

  function download(filename, text) {
    const blob = new Blob([text], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  }
  $("exportBtn").onclick = () => {
    if (!state.annotator) return;
    let out, name;
    if (state.mode === "multi") {
      out = state.sheet.map(r => ({
        query_id: r.query_id, annotator_id: state.annotator,
        picked: state.answers[r.query_id] || []
      }));
      name = "annotations-" + state.annotator + ".json";
    } else {
      out = state.pairs.map(t => ({
        query_id: t.query_id, pair_id: t.pair_id, annotator_id: state.annotator,
        winner: state.answers[t.pair_id] === undefined ? null : state.answers[t.pair_id]
      }));
      name = "pair-annotations-" + state.annotator + ".json";
    }
    download(name, JSON.stringify(out, null, 2) + "\n");
  };

  $("saveProgressBtn").onclick = () => {
    localStorage.setItem(lsKey(), JSON.stringify({
      annotator: state.annotator, answers: state.answers, index: state.index
    }));
    setStatus("进度已保存到本机浏览器。", "ok");
  };
  $("loadProgressBtn").onclick = () => {
    const raw = localStorage.getItem(lsKey());
    if (!raw) { setStatus("本机没有已保存的进度。", "warn"); return; }
    const data = JSON.parse(raw);
    state.annotator = data.annotator || "";
    $("annotatorId").value = state.annotator;
    state.answers = data.answers || {};
    if (state.mode === "multi") {
      for (const rec of state.sheet) if (!(rec.query_id in state.answers)) state.answers[rec.query_id] = [];
    } else {
      for (const t of state.pairs) if (!(t.pair_id in state.answers)) state.answers[t.pair_id] = null;
    }
    state.index = Math.min(data.index || 0, currentLen() - 1);
    render();
    setStatus("已载入本机进度。", "ok");
  };

  setMode("multi");
})();
</script>
</body>
</html>
